<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ===== CORE VARIABLES & THEME ===== */
:root {
    --primary-hue: 260;
    --secondary-hue: 190;
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.2);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.8);
    --card-radius: 24px;
    --transition: cubic-bezier(0.23, 1, 0.32, 1);
}
* { margin:0; padding:0; box-sizing:border-box; scroll-behavior:smooth; }
body { font-family:'Inter', sans-serif; background-color:#050510; color:var(--text-main); overflow-x:hidden; perspective:1000px; }

/* ===== FLUID BACKGROUND ===== */
.fluid-bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-2; background:radial-gradient(circle at 50% 50%, #1a1a2e, #000); overflow:hidden; }
.orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:0.6; animation:floatOrb 20s infinite alternate; }
.orb-1 { width:60vw; height:60vw; background:#4e00c2; top:-10%; left:-10%; animation-duration:25s; }
.orb-2 { width:50vw; height:50vw; background:#00c6ff; bottom:-10%; right:-10%; animation-duration:30s; animation-direction:reverse; }
.orb-3 { width:30vw; height:30vw; background:#ff007a; top:40%; left:40%; animation-duration:20s; }

@keyframes floatOrb { 0% { transform:translate(0,0) scale(1); } 100% { transform:translate(50px,-50px) scale(1.1); } }

/* ===== FLOATING BUBBLES ===== */
.bubbles-container { position:fixed; width:100%; height:100%; z-index:-1; pointer-events:none; }
.bubble { position:absolute; bottom:-100px; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.3); border-radius:50%; box-shadow: inset 0 0 20px rgba(255,255,255,0.1); animation:rise 15s infinite linear; }
@keyframes rise { 0% { transform:translateY(0) rotate(0deg); opacity:0; } 10% { opacity:1; } 100% { transform:translateY(-120vh) rotate(360deg); opacity:0; } }

/* ===== HERO 3D SECTION ===== */
.hero { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:100px 20px; perspective:1000px; position:relative; overflow:hidden; }
.hero-content { display:grid; grid-template-columns:1fr 1fr; gap:50px; max-width:1300px; align-items:center; position:relative; z-index:2; }
.hero-text { transform-style:preserve-3d; z-index:2; }
.hero-badge { display:inline-block; padding:8px 20px; background:linear-gradient(90deg,#ff007a,#6a11cb); border-radius:30px; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:2px; margin-bottom:20px; box-shadow:0 0 20px rgba(255,0,122,0.4); }
.hero h1 { font-size:clamp(3rem,6vw,5rem); line-height:1.1; background:linear-gradient(135deg,#fff 0%,#a5f3fc 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:20px; filter:drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
.hero p { font-size:1.2rem; line-height:1.8; color:var(--text-muted); margin-bottom:30px; border-left:4px solid #2575fc; padding-left:20px; }

/* ===== HERO IMAGE ===== */
.hero-img-container { position:relative; width:100%; height:600px; transform-style:preserve-3d; }
.hero-img-bg { position:absolute; inset:0; background:url('hero-bg.jpg.jpeg') center/cover no-repeat; border-radius:40px; opacity:0.4; transform:translateZ(-50px) scale(0.9); filter:blur(10px); }
.hero-img-main { position:absolute; width:280px; height:380px; top:50%; left:50%; transform:translate(-50%,-50%) translateZ(50px); background:url('portrait.jpg.jpeg') center/cover no-repeat; border-radius:30px; border:1px solid rgba(255,255,255,0.1); box-shadow:0 30px 80px rgba(0,0,0,0.6), inset 0 0 25px rgba(0,0,0,0.25); transition:transform 0.3s ease, box-shadow 0.3s ease; z-index:5; animation:floatPortrait 6s ease-in-out infinite; }
@keyframes floatPortrait { 0%,100% { transform:translate(-50%,-50%) translateZ(50px) rotateY(0deg) rotateX(0deg); } 25% { transform:translate(-50%,-52%) translateZ(60px) rotateY(2deg) rotateX(1deg); } 50% { transform:translate(-50%,-50%) translateZ(50px) rotateY(0deg) rotateX(0deg); } 75% { transform:translate(-50%,-48%) translateZ(60px) rotateY(-2deg) rotateX(-1deg); } }

/* ===== HERO SOCIALS ===== */
.hero-socials { display:grid; grid-template-columns:repeat(6,1fr); gap:18px; justify-items:center; align-items:center; margin:35px auto 0; max-width:520px; position:relative; z-index:5; }
.hero-socials .hs { width:55px; height:55px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; text-decoration:none; backdrop-filter:blur(10px); box-shadow:0 12px 25px rgba(0,0,0,0.35), inset 0 0 15px rgba(255,255,255,0.15); transform-style:preserve-3d; transition:all 0.35s ease; }
.hero-socials .hs:hover { transform:translateY(-12px) rotateX(20deg) rotateY(-20deg) scale(1.15); box-shadow:0 25px 45px rgba(0,0,0,0.6), 0 0 25px currentColor; }

/* Social colors */
.hs.mail { background:linear-gradient(135deg,#D44638,#B23121); }
.hs.whatsapp { background:linear-gradient(135deg,#25D366,#128C7E); }
.hs.linkedin { background:linear-gradient(135deg,#0077B5,#004182); }
.hs.instagram { background:linear-gradient(135deg,#833AB4,#FD1D1D,#F77737); }
.hs.facebook { background:linear-gradient(135deg,#1877F2,#0F4AA1); }
.hs.twitter { background:linear-gradient(135deg,#000,#444); }
.hs.wef { background:linear-gradient(135deg,#00A3E0,#005F86); }
.hs.linktree { background:linear-gradient(135deg,#43E660,#1FA337); }

/* ===== NAVIGATION ===== */
nav { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000; background:rgba(20,20,30,0.6); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1); padding:15px 30px; border-radius:50px; display:flex; gap:20px; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
nav a { color:#fff; text-decoration:none; font-size:20px; transition:0.3s; position:relative; }
nav a:hover { color:#00c6ff; transform:translateY(-5px); }
nav a::after { content:attr(data-tooltip); position:absolute; bottom:40px; left:50%; transform:translateX(-50%) scale(0); background:#fff; color:#000; padding:5px 10px; border-radius:8px; font-size:12px; font-weight:bold; opacity:0; transition:0.3s; pointer-events:none; }
nav a:hover::after { transform:translateX(-50%) scale(1); opacity:1; }

/* ===== MEDIA QUERIES ===== */
@media(max-width:768px){
.hero-content{grid-template-columns:1fr;text-align:center;}
.hero-img-container{height:400px;margin-top:40px;}
.hero-img-main{width:220px;height:300px;}
.timeline::before{left:0;}
.timeline-item{justify-content:flex-start !important;padding-left:30px;}
.timeline-content{width:100%;}
.timeline-dot{left:0;}
nav{padding:10px 20px;width:90%;gap:15px;}
nav a{font-size:16px;}
.hero-socials{grid-template-columns:repeat(3,1fr); max-width:260px; gap:16px;}
}

/* ===== OTHER SECTIONS & GLASS CARDS REMAIN UNCHANGED ===== */

/* You can safely keep your original glass-card, timeline, grid-3, gallery, connect-box, etc. styles here as-is. */

</style>
</head>

<!-- THEME BUTTON -->
<button class="theme-btn" onclick="randomizeTheme()">

</button>

<!-- NAVIGATION -->
<nav>
    <a href="#hero" data-tooltip="Home"><i class="fas fa-home"></i></a>
    <a href="#about" data-tooltip="About"><i class="fas fa-user"></i></a>

    <a href="#leadership" data-tooltip="Leadership"><i class="fas fa-globe"></i></a>
    <a href="#gallery" data-tooltip="Gallery"><i class="fas fa-images"></i></a>
    <a href="#contact" data-tooltip="Connect"><i class="fas fa-paper-plane"></i></a>
</nav>

<!-- HERO SECTION -->
<section id="hero" class="hero">
    <div class="hero-3d-bg">
        <div class="hero-3d-layer"></div>
    </div>

    <div class="hero-content">
        <div class="hero-text">
            <span class="hero-badge">Advocate & Changemaker</span>
            <h1>Mumtaz Alam <br> Bazai</h1>
            <p>Advocate High Court · Human Rights Lawyer · Global Shaper (WEF).<br>
            Empowering the youth of Balochistan through law, leadership, and unwavering justice.</p>
            <div style="margin-top:30px;">
                <a href="#contact" style="padding:15px 35px; background:#fff; color:#000; border-radius:30px; text-decoration:none; font-weight:700; margin-right:15px; box-shadow:0 0 20px rgba(255,255,255,0.4);">Get in Touch</a>
                <a href="https://linktr.ee/mumtazalam" target="_blank" style="padding:15px 35px; background:transparent; border:2px solid #fff; color:#fff; border-radius:30px; text-decoration:none; font-weight:700;">Portfolio</a>
            </div>
        </div>

        <div class="hero-img-container" id="heroTilt">
            <div class="hero-img-bg"></div>
            <div class="hero-img-main"></div>
        </div>

        <div class="hero-socials">
            <!-- Add all your social icons here exactly as in original code -->
        </div>
    </div>
</section>

<!-- Keep the rest of your sections (about, career, leadership, gallery, mission, contact, footer) exactly the same -->

<script>
// ===== FLOATING BUBBLES =====
const bubbleContainer = document.getElementById('bubbles');
function createBubble(){
    const bubble = document.createElement('div');
    bubble.classList.add('bubble');
    const size=Math.random()*60+20+'px';
    bubble.style.width=size;
    bubble.style.height=size;
    bubble.style.left=Math.random()*100+'%';
    bubble.style.animationDuration=Math.random()*10+10+'s';
    bubbleContainer.appendChild(bubble);
    setTimeout(()=>{ bubble.remove(); },20000);
}
setInterval(createBubble,1000);

// ===== HERO IMAGE 3D TILT =====
const heroSection = document.getElementById('hero');
const heroImg = document.getElementById('heroTilt').querySelector('.hero-img-main');
const heroBg = document.querySelector('.hero-3d-layer');

heroSection.addEventListener('mousemove', e=>{
    const x=(window.innerWidth/2 - e.pageX)/25;
    const y=(window.innerHeight/2 - e.pageY)/25;
    heroImg.style.transform=`translate(-50%, -50%) translateZ(50px) rotateY(${x}deg) rotateX(${y}deg)`;
    
    const bgX=(e.clientX/window.innerWidth-0.5)*35;
    const bgY=(e.clientY/window.innerHeight-0.5)*35;
    heroBg.style.transform=`translateZ(-180px) rotateY(${bgX}deg) rotateX(${-bgY}deg) scale(1.22)`;
});

heroSection.addEventListener('mouseleave', ()=>{
    heroImg.style.transform=`translate(-50%, -50%) translateZ(50px) rotateY(0deg) rotateX(0deg)`;
    heroBg.style.transform=`translateZ(-160px) rotateY(0deg) rotateX(0deg) scale(1.18)`;
});

// ===== SCROLL REVEAL =====
const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add('visible');
            entry.target.style.transform='translateY(0) scale(1)';
        }
    });
},{threshold:0.1});

document.querySelectorAll('.timeline-item, .glass-card, .gallery-item').forEach(el=>{
    el.style.opacity='0';
    el.style.transform='translateY(50px)';
    el.style.transition='all 0.8s ease-out';
    observer.observe(el);
});
</script>
