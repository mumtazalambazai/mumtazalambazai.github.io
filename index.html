<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumtaz Alam Bazai | Legal Visionary & Human Rights Advocate</title>
    <meta name="description" content="Advocate High Court, Global Shaper, and Human Rights Activist.">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* =========================
           CORE RESET & VARIABLES
        ========================= */
        :root {
            --primary-hue: 260;
            --secondary-hue: 190;
            --accent-hue: 330;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.8);
            --neon-glow: 0 0 20px rgba(138, 43, 226, 0.6);
            --card-radius: 24px;
            --transition: cubic-bezier(0.23, 1, 0.32, 1);
            --gradient-primary: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --gradient-secondary: linear-gradient(135deg, #ff007a 0%, #ff8c00 100%);
            --gradient-accent: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050510;
            color: var(--text-main);
            overflow-x: hidden;
            perspective: 1000px;
            min-height: 100vh;
            opacity: 0;
            animation: fadeInBody 1.5s ease forwards;
        }

        @keyframes fadeInBody {
            to { opacity: 1; }
        }

        /* =========================
           DYNAMIC ANIMATED BACKGROUND
        ========================= */
        .fluid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background: 
                radial-gradient(circle at 20% 20%, rgba(26, 26, 46, 0.8) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 198, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(255, 0, 122, 0.1) 0%, transparent 50%),
                #050510;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: floatOrb 25s infinite alternate ease-in-out;
            z-index: -2;
        }

        .orb-1 {
            width: 70vw;
            height: 70vw;
            background: #6a11cb;
            top: -20%;
            left: -20%;
            animation-duration: 30s;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 60vw;
            height: 60vw;
            background: #00c6ff;
            bottom: -20%;
            right: -10%;
            animation-duration: 35s;
            animation-delay: 5s;
            animation-direction: reverse;
        }

        .orb-3 {
            width: 40vw;
            height: 40vw;
            background: #ff007a;
            top: 50%;
            left: 30%;
            animation-duration: 25s;
            animation-delay: 10s;
        }

        .orb-4 {
            width: 50vw;
            height: 50vw;
            background: #ff8c00;
            bottom: 30%;
            left: 10%;
            animation-duration: 40s;
            animation-delay: 15s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(30px, -50px) scale(1.05) rotate(90deg); }
            50% { transform: translate(-20px, 40px) scale(1.1) rotate(180deg); }
            75% { transform: translate(50px, 30px) scale(1.05) rotate(270deg); }
            100% { transform: translate(0, 0) scale(1) rotate(360deg); }
        }

        /* =========================
           FLOATING PARTICLES
        ========================= */
        .particles-container {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1));
            animation: floatParticle 20s infinite linear;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* =========================
           CUSTOM SCROLLBAR
        ========================= */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gradient-primary);
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gradient-secondary);
            transform: scale(1.1);
        }

        /* =========================
           TYPOGRAPHY
        ========================= */
        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            background-clip: text;
            -webkit-background-clip: text;
        }

        .gradient-text {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-fill-color: transparent;
        }

        /* =========================
           DYNAMIC NAVIGATION (GLASS DOCK)
        ========================= */
        nav {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px 35px;
            border-radius: 60px;
            display: flex;
            gap: 30px;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.7),
                0 0 25px rgba(106, 17, 203, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: slideUpNav 0.8s ease-out 0.5s both;
        }

        @keyframes slideUpNav {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(100px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        nav.scrolled {
            bottom: 20px;
            background: rgba(10, 10, 20, 0.95);
            padding: 15px 30px;
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(106, 17, 203, 0.5);
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            z-index: 1;
            overflow: hidden;
        }

        nav a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
            border-radius: 50%;
        }

        nav a:hover::before {
            opacity: 1;
        }

        nav a:hover {
            color: #fff;
            transform: translateY(-8px) scale(1.15);
            box-shadow: 
                0 10px 25px rgba(106, 17, 203, 0.5),
                0 0 15px rgba(255, 255, 255, 0.3);
        }

        nav a.active {
            background: var(--gradient-primary);
            color: #fff;
            transform: translateY(-5px);
            box-shadow: 
                0 8px 20px rgba(106, 17, 203, 0.6),
                0 0 15px rgba(255, 255, 255, 0.2);
        }

        nav a::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        nav a:hover::after {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        /* =========================
           THEME BUTTON
        ========================= */
        .theme-btn {
            position: fixed;
            top: 35px;
            right: 35px;
            background: var(--gradient-secondary);
            border: none;
            color: white;
            padding: 14px 28px;
            border-radius: 35px;
            font-weight: 700;
            cursor: pointer;
            z-index: 2000;
            box-shadow: 
                0 0 30px rgba(255, 0, 122, 0.6),
                0 8px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            animation: slideDownBtn 0.8s ease-out 0.7s both;
        }

        @keyframes slideDownBtn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .theme-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.6s;
        }

        .theme-btn:hover::before {
            left: 100%;
        }

        .theme-btn:hover {
            transform: scale(1.12) rotate(3deg);
            box-shadow: 
                0 0 45px rgba(255, 0, 122, 0.8),
                0 12px 25px rgba(0, 0, 0, 0.5);
        }

        /* =========================
           HERO SECTION (ULTRA ENHANCED)
        ========================= */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 140px 20px 100px;
            perspective: 2000px;
            overflow: hidden;
            position: relative;
            animation: heroEntrance 1.2s ease-out;
        }

        @keyframes heroEntrance {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-3d-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            perspective: 2500px;
            overflow: hidden;
            border-radius: 40px;
            margin: 20px;
            filter: drop-shadow(0 0 40px rgba(0, 0, 0, 0.5));
        }

        .hero-3d-layer {
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(
                    rgba(0, 0, 0, 0.4),
                    rgba(0, 0, 0, 0.6)
                ),
                url('hero-bg.jpg.jpeg') center/cover no-repeat;
            transform: translateZ(-300px) scale(1.4);
            filter: 
                blur(2px)
                brightness(1.15)
                contrast(1.2)
                saturate(1.3);
            transition: transform 0.3s ease-out;
            border-radius: 40px;
            animation: bgFloat 20s infinite alternate ease-in-out;
        }

        @keyframes bgFloat {
            0%, 100% { 
                transform: translateZ(-300px) scale(1.4) rotate(0.5deg); 
            }
            50% { 
                transform: translateZ(-300px) scale(1.42) rotate(-0.5deg); 
            }
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 80px;
            max-width: 1400px;
            align-items: center;
            position: relative;
            z-index: 2;
            transform-style: preserve-3d;
        }

        .hero-text {
            transform-style: preserve-3d;
            z-index: 2;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px) translateZ(-100px);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(0);
            }
        }

        .hero-badge {
            display: inline-block;
            padding: 12px 28px;
            background: var(--gradient-primary);
            border-radius: 35px;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 30px;
            box-shadow: 
                0 0 30px rgba(106, 17, 203, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transform: translateZ(40px);
            animation: badgeGlow 3s ease-in-out infinite, badgeFloat 6s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        @keyframes badgeGlow {
            0%, 100% { 
                box-shadow: 
                    0 0 30px rgba(106, 17, 203, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.3); 
            }
            50% { 
                box-shadow: 
                    0 0 45px rgba(106, 17, 203, 0.7),
                    inset 0 1px 0 rgba(255, 255, 255, 0.5); 
            }
        }

        @keyframes badgeFloat {
            0%, 100% { transform: translateZ(40px) translateY(0); }
            50% { transform: translateZ(40px) translateY(-10px); }
        }

        .hero h1 {
            font-size: clamp(3.5rem, 7vw, 6rem);
            line-height: 1.08;
            background: linear-gradient(135deg, #fff 0%, #a5f3fc 30%, #6a11cb 70%, #ff007a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
            transform: translateZ(50px);
            animation: titleShine 8s infinite linear;
            background-size: 200% auto;
        }

        @keyframes titleShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .hero p {
            font-size: 1.3rem;
            line-height: 1.9;
            color: var(--text-muted);
            margin-bottom: 40px;
            border-left: 5px solid #2575fc;
            padding-left: 25px;
            transform: translateZ(30px);
            position: relative;
            overflow: hidden;
        }

        .hero p::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(37, 117, 252, 0.1), transparent);
            animation: textShine 3s infinite;
        }

        @keyframes textShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .hero-buttons {
            margin-top: 50px;
            transform: translateZ(40px);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .hero-btn {
            padding: 18px 40px;
            border-radius: 35px;
            text-decoration: none;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            min-width: 200px;
            text-align: center;
            animation: btnEntrance 0.8s ease-out 0.8s both;
        }

        @keyframes btnEntrance {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-btn:nth-child(2) {
            animation-delay: 1s;
        }

        .btn-primary {
            background: #fff;
            color: #000;
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #fff, #f0f0f0);
            transform: translateY(-8px) scale(1.05);
            box-shadow: 
                0 0 45px rgba(255, 255, 255, 0.7),
                0 12px 35px rgba(0, 0, 0, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.8);
            color: #fff;
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.2),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #fff;
            transform: translateY(-8px) scale(1.05);
            box-shadow: 
                0 0 35px rgba(255, 255, 255, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .hero-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.6s;
        }

        .hero-btn:hover::before {
            left: 100%;
        }

        /* =========================
           PORTRAIT 3D CONTAINER (SMALLER & RIGHT CORNER)
        ========================= */
        .hero-img-container {
            position: relative;
            width: 100%;
            height: 700px;
            transform-style: preserve-3d;
            perspective: 1800px;
            animation: portraitFloat 8s ease-in-out infinite;
        }

        @keyframes portraitFloat {
            0%, 100% { 
                transform: translateZ(0) rotateX(0) rotateY(0); 
            }
            25% { 
                transform: translateZ(50px) rotateX(5deg) rotateY(5deg); 
            }
            50% { 
                transform: translateZ(0) rotateX(0) rotateY(0); 
            }
            75% { 
                transform: translateZ(50px) rotateX(-5deg) rotateY(-5deg); 
            }
        }

        .hero-img-bg {
            position: absolute;
            inset: 0;
            background: url('hero-bg.jpg.jpeg') center/cover no-repeat;
            border-radius: 40px;
            opacity: 0.3;
            transform: translateZ(-150px) scale(0.9);
            filter: blur(15px) brightness(0.3);
            box-shadow: 
                inset 0 0 100px rgba(0, 0, 0, 0.8),
                0 0 60px rgba(106, 17, 203, 0.4);
            animation: bgPulse 10s infinite alternate;
        }

        /* PORTRAIT IMAGE - SMALLER AND IN RIGHT CORNER */
        .hero-img-main {
            position: absolute;
            width: 180px;  /* Smaller size */
            height: 240px; /* Smaller size */
            top: 5%;       /* Higher up */
            right: 2%;     /* More to the right corner */
            transform: translateZ(150px);
            background: url('portrait.jpg.jpeg') center/cover no-repeat;
            border-radius: 20px; /* Slightly smaller radius */
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
            animation: floatPortrait 9s ease-in-out infinite;
            overflow: visible;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(106, 17, 203, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.1);
        }

        @keyframes floatPortrait {
            0%, 100% { 
                transform: translateZ(150px) rotateY(0deg) rotateX(0deg) translateY(0); 
            }
            25% { 
                transform: translateZ(180px) rotateY(5deg) rotateX(3deg) translateY(-10px);
            }
            50% { 
                transform: translateZ(150px) rotateY(0deg) rotateX(0deg) translateY(0); 
            }
            75% { 
                transform: translateZ(180px) rotateY(-5deg) rotateX(-3deg) translateY(10px); 
            }
        }

        .hero-img-main:hover {
            transform: translateZ(200px) rotateY(6deg) rotateX(3deg) scale(1.08);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                0 0 50px rgba(106, 17, 203, 0.7),
                inset 0 0 50px rgba(255, 255, 255, 0.2);
        }

        .hero-img-main::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                45deg,
                transparent 20%,
                rgba(255, 255, 255, 0.05) 40%,
                transparent 80%
            );
            z-index: 1;
            animation: portraitShine 6s ease-in-out infinite;
            border-radius: 20px;
        }

        .hero-img-frame {
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border: 2px solid transparent;
            border-radius: 25px;
            background: linear-gradient(45deg, #6a11cb, #2575fc, #ff007a, #ff8c00) border-box;
            -webkit-mask: 
                linear-gradient(#fff 0 0) padding-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
            animation: frameRotate 20s linear infinite;
        }

        .float-card {
            position: absolute;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            padding: 15px 25px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(106, 17, 203, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 14px;
            transform: translateZ(100px);
            animation: floatCard 7s ease-in-out infinite;
            z-index: 6;
            overflow: hidden;
            min-width: 180px;
        }

        .float-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.6s;
        }

        .float-card:hover::before {
            left: 100%;
        }

        /* Adjusted floating card positions for smaller portrait */
        .fc-1 {
            top: 2%;       /* Adjusted up */
            right: 8%;     /* Adjusted position */
            animation-delay: 0s;
            background: rgba(106, 17, 203, 0.15);
        }

        .fc-2 {
            top: 22%;      /* Adjusted down */
            right: -4%;    /* Adjusted position */
            animation-delay: 2s;
            background: rgba(37, 117, 252, 0.15);
        }

        .fc-3 {
            bottom: 25%;   /* Adjusted up */
            right: 10%;    /* Adjusted position */
            animation-delay: 4s;

        /* =========================
           SECTIONS & GLASS CARDS
        ========================= */
        section {
            max-width: 1300px;
            margin: 0 auto;
            padding: 150px 20px;
            position: relative;
            transform-style: preserve-3d;
            opacity: 0;
            transform: translateY(80px);
            transition: opacity 1s ease, transform 1s ease;
        }

        section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-title {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 100px;
            position: relative;
            z-index: 1;
            transform: translateZ(40px);
            animation: titleEntrance 1s ease-out both;
        }

        @keyframes titleEntrance {
            from {
                opacity: 0;
                transform: translateZ(40px) translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateZ(40px) translateY(0);
            }
        }

        .section-title::after {
            content: '';
            display: block;
            width: 150px;
            height: 6px;
            background: linear-gradient(90deg, #6a11cb, #2575fc, #ff007a, #ff8c00);
            margin: 25px auto 0;
            border-radius: 3px;
            animation: linePulse 4s ease-in-out infinite;
        }

        @keyframes linePulse {
            0%, 100% { 
                width: 150px;
                opacity: 1;
            }
            50% { 
                width: 200px;
                opacity: 0.8;
            }
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 60px;
            box-shadow: 
                var(--glass-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.7s var(--transition);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transform: translateZ(0);
            animation: cardEntrance 1s ease-out both;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateZ(0) translateY(60px) rotateX(10deg);
            }
            to {
                opacity: 1;
                transform: translateZ(0) translateY(0) rotateX(0);
            }
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.15),
                transparent
            );
            transition: 0.8s;
            z-index: 1;
        }

        .glass-card:hover::before {
            left: 100%;
        }

        .glass-card:hover {
            transform: translateY(-20px) rotateX(5deg) rotateY(5deg) translateZ(40px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 50px 100px rgba(106, 17, 203, 0.5),
                inset 0 0 40px rgba(255, 255, 255, 0.2);
        }

        /* =========================
           TIMELINE (3D ENHANCED)
        ========================= */
        .timeline {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            transform-style: preserve-3d;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            width: 4px;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent,
                #6a11cb,
                #2575fc,
                #ff007a,
                #ff8c00,
                transparent
            );
            transform: translateX(-50%);
            box-shadow: 0 0 40px rgba(106, 17, 203, 0.7);
            animation: timelinePulse 3s infinite;
        }

        @keyframes timelinePulse {
            0%, 100% { box-shadow: 0 0 40px rgba(106, 17, 203, 0.7); }
            50% { box-shadow: 0 0 60px rgba(106, 17, 203, 0.9); }
        }

        .timeline-item {
            margin-bottom: 80px;
            width: 100%;
            display: flex;
            justify-content: center;
            opacity: 0;
            transform: translateY(80px) rotateX(30deg);
            transition: all 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .timeline-item.visible {
            opacity: 1;
            transform: translateY(0) rotateX(0);
        }

        .timeline-content {
            width: 48%;
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.5s ease;
            overflow: hidden;
        }

        .timeline-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--gradient-accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease;
        }

        .timeline-content:hover::before {
            transform: scaleX(1);
        }

        .timeline-content:hover {
            transform: translateZ(30px);
            border-color: rgba(0, 198, 255, 0.5);
            box-shadow: 
                0 30px 60px rgba(0, 198, 255, 0.3),
                inset 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .timeline-item:nth-child(odd) {
            justify-content: flex-start;
        }

        .timeline-item:nth-child(even) {
            justify-content: flex-end;
        }

        .timeline-content h4 {
            color: #00c6ff;
            margin-bottom: 20px;
            font-size: 1.6rem;
            text-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
        }

        .timeline-dot {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #fff;
            border-radius: 50%;
            left: 50%;
            top: 30px;
            transform: translateX(-50%) translateZ(15px);
            box-shadow: 
                0 0 40px #00c6ff,
                0 0 25px #00c6ff,
                inset 0 0 15px rgba(255, 255, 255, 0.7);
            z-index: 5;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { 
                box-shadow: 
                    0 0 40px #00c6ff,
                    0 0 25px #00c6ff,
                    inset 0 0 15px rgba(255, 255, 255, 0.7); 
            }
            50% { 
                box-shadow: 
                    0 0 60px #00c6ff,
                    0 0 40px #00c6ff,
                    inset 0 0 20px rgba(255, 255, 255, 0.9); 
            }
        }

        /* =========================
           GRID LAYOUTS
        ========================= */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 50px;
            transform-style: preserve-3d;
        }

        .skill-tag {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .skill-tag:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(15px) translateZ(15px);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(106, 17, 203, 0.3);
        }

        .skill-tag i {
            font-size: 32px;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 198, 255, 0.5));
        }

        /* =========================
           3D GALLERY
        ========================= */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
            transform-style: preserve-3d;
        }

        .gallery-item {
            height: 350px;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.6),
                inset 0 0 25px rgba(255, 255, 255, 0.08);
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            transform: rotateX(8deg) rotateY(8deg);
            opacity: 0;
            animation: galleryEntrance 0.8s ease-out forwards;
        }

        .gallery-item:nth-child(even) {
            transform: rotateX(-8deg) rotateY(-8deg);
            animation-delay: 0.2s;
        }

        .gallery-item:nth-child(3), .gallery-item:nth-child(6) {
            animation-delay: 0.4s;
        }

        @keyframes galleryEntrance {
            to {
                opacity: 1;
                transform: rotateX(0) rotateY(0);
            }
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.7s ease;
            filter: brightness(0.9);
        }

        .gallery-item:hover {
            transform: scale(1.12) rotateX(0) rotateY(0) translateZ(60px);
            box-shadow: 
                0 40px 80px rgba(0, 198, 255, 0.7),
                0 0 60px rgba(106, 17, 203, 0.7);
            z-index: 100;
        }

        .gallery-item:hover img {
            transform: scale(1.2);
            filter: brightness(1.1);
        }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(
                transparent,
                rgba(0, 0, 0, 0.9)
            );
            padding: 30px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease;
            z-index: 2;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================
           THEMATIC AREAS
        ========================= */
        .thematic-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .theme-tag {
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            border: 2px solid;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            animation: tagFloat 6s ease-in-out infinite;
        }

        .theme-tag:nth-child(odd) {
            animation-delay: 1s;
        }

        @keyframes tagFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .theme-tag::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: 0.6s;
        }

        .theme-tag:hover::before {
            left: 100%;
        }

        .theme-tag:hover {
            transform: translateY(-8px) scale(1.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border-width: 3px;
        }

        /* =========================
           CONNECT SECTION
        ========================= */
        .connect-box {
            text-align: center;
            transform-style: preserve-3d;
        }

        .social-3d-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            margin-top: 60px;
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        .social-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #fff;
            text-decoration: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 25px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            animation: socialBtnEntrance 0.8s ease-out both;
        }

        .social-btn:nth-child(2) { animation-delay: 0.1s; }
        .social-btn:nth-child(3) { animation-delay: 0.2s; }
        .social-btn:nth-child(4) { animation-delay: 0.3s; }
        .social-btn:nth-child(5) { animation-delay: 0.4s; }
        .social-btn:nth-child(6) { animation-delay: 0.5s; }
        .social-btn:nth-child(7) { animation-delay: 0.6s; }
        .social-btn:nth-child(8) { animation-delay: 0.7s; }
        .social-btn:nth-child(9) { animation-delay: 0.8s; }
        .social-btn:nth-child(10) { animation-delay: 0.9s; }
        .social-btn:nth-child(11) { animation-delay: 1s; }
        .social-btn:nth-child(12) { animation-delay: 1.1s; }

        @keyframes socialBtnEntrance {
            from {
                opacity: 0;
                transform: translateY(50px) rotateX(90deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--c1), var(--c2));
            opacity: 0;
            transition: all 0.6s ease;
            z-index: 1;
        }

        .social-btn:hover {
            transform: rotateX(25deg) rotateY(25deg) translateY(-20px) scale(1.2);
            box-shadow: 
                0 35px 70px rgba(0, 0, 0, 0.7),
                0 0 40px var(--c1),
                inset 0 0 40px rgba(255, 255, 255, 0.25);
            border-color: transparent;
        }

        .social-btn:hover::before {
            opacity: 1;
        }

        .social-btn i {
            transition: all 0.6s ease;
            z-index: 2;
            position: relative;
        }

        .social-btn:hover i {
            transform: scale(1.4) translateZ(40px);
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
        }

        /* =========================
           MISSION STATEMENT
        ========================= */
        .mission-card {
            background: linear-gradient(
                135deg,
                rgba(106, 17, 203, 0.5),
                rgba(37, 117, 252, 0.5),
                rgba(255, 0, 122, 0.5),
                rgba(255, 140, 0, 0.5)

            border: 1px solid rgba(255, 255, 255, 0.3);

            overflow: hidden;
            transform-style: preserve-3d;

        @keyframes missionGlow {
            0%, 100% { 
                box-shadow: 
                    0 30px 80px rgba(106, 17, 203, 0.6),
                    0 0 50px rgba(106, 17, 203, 0.4); 
            }
            50% { 
                box-shadow: 
                    0 40px 100px rgba(106, 17, 203, 0.8),
                    0 0 70px rgba(106, 17, 203, 0.6); 
            }
        }

        @keyframes missionFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .mission-card i {
            font-size: 70px;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.7);
            animation: missionIcon 3s ease-in-out infinite;
        }

        @keyframes missionIcon {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .mission-card h2 {
            font-size: 3rem;
            margin-bottom: 35px;
            background: linear-gradient(45deg, #fff, #a5f3fc, #ffcce6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);

            font-size: 1.8rem;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            line-height: 1.9;
            max-width: 900px;
            margin: 0 auto;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* =========================
           FOOTER
        ========================= */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            font-size: 15px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #6a11cb, #2575fc, #ff007a, #ff8c00, transparent);
        }

        footer::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: footerShine 8s infinite;
        }

        @keyframes footerShine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

            border-right: 5px solid #2575fc;
            border-bottom: 5px solid #ff007a;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #6a11cb, #2575fc, #ff007a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: loaderText 2s ease-in-out infinite;
        }

        @keyframes loaderText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
