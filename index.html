  <style>
    /* =========================
       CSS LAYERS & VARIABLES
    ========================= */
    @layer reset, base, components, utilities, animations;

    @layer reset {
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; overflow-x: hidden; }
      body { overflow-x: hidden; min-height: 100vh; }
      img, svg { display: block; max-width: 100%; }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; }
      :focus-visible { outline: 2px solid #38bdf8; outline-offset: 3px; border-radius: 8px; }
    }

    @layer base {
      :root {
        --primary-hue: 260;
        --secondary-hue: 190;

        --bg-0: #050510;
        --text-main: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.82);

        --glass-bg: rgba(255, 255, 255, 0.06);
        --glass-border: rgba(255, 255, 255, 0.18);
        --glass-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);

        --neon-a: 0 0 24px rgba(138, 43, 226, 0.6);
        --neon-b: 0 0 32px rgba(0, 198, 255, 0.45);

        --card-radius: 24px;
        --radius-lg: 32px;

        --trans-1: cubic-bezier(0.23, 1, 0.32, 1);
        --trans-2: cubic-bezier(0.4, 0, 0.2, 1);

        --gradient-hero: conic-gradient(from 220deg at 50% 50%, #6a11cb, #2575fc, #ff007a, #6a11cb);
        --gradient-1: linear-gradient(135deg, #ff007a, #6a11cb);
        --gradient-2: linear-gradient(90deg, #6a11cb, #2575fc, #ff007a);

        --ring: 0 0 0 1px rgba(255,255,255,0.12), 0 0 0 10px rgba(99,102,241,0.12);

        --shadow-soft: 0 20px 60px rgba(0,0,0,0.45);
        --shadow-strong: 0 30px 80px rgba(0,0,0,0.6);

        --blur-10: blur(10px);
        --blur-20: blur(20px);

        --shimmer: linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.12) 18%, transparent 33%);
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
        html { scroll-behavior: auto; }
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
        background: radial-gradient(1200px 800px at 10% -10%, #0f0d22, transparent 60%), radial-gradient(1200px 800px at 110% 110%, #0b0a1a, transparent 60%), var(--bg-0);
        color: var(--text-main);
        perspective: 1200px;
      }

      h1, h2, h3 {
        font-family: 'Playfair Display', ui-serif, Georgia, Cambria, Times, 'Times New Roman', serif;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
    }

    @layer components {
      /* BACKGROUNDS: nebula + starfield + glow orbs */
      .fluid-bg {
        position: fixed; inset: 0; z-index: -3;
        background:
          radial-gradient(1200px 800px at 15% 15%, rgba(106,17,203,0.25), transparent 60%),
          radial-gradient(1000px 700px at 85% 85%, rgba(37,117,252,0.25), transparent 60%),
          radial-gradient(900px 600px at 40% 60%, rgba(255, 0, 122, 0.18), transparent 60%),
          radial-gradient(circle at 50% 50%, #0d0c1f 0%, #000 80%);
        overflow: hidden;
        filter: saturate(1.1);
      }

      canvas#stars, canvas#vortex {
        position: fixed; inset: 0; z-index: -2; pointer-events: none;
      }

      .orb {
        position: absolute; border-radius: 50%;
        filter: blur(80px) saturate(130%); opacity: 0.65;
        box-shadow: inset 0 0 120px rgba(255,255,255,0.08), 0 0 180px rgba(255,255,255,0.05);
        animation: floatOrb 22s infinite alternate var(--trans-1);
      }
      .orb-1 { width: 60vw; height: 60vw; background: #4e00c2; top: -10%; left: -10%; animation-duration: 26s; }
      .orb-2 { width: 50vw; height: 50vw; background: #00c6ff; bottom: -10%; right: -8%; animation-duration: 30s; animation-direction: reverse; }
      .orb-3 { width: 30vw; height: 30vw; background: #ff007a; top: 35%; left: 45%; animation-duration: 20s; }

      .bubbles-container { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
      .bubble {
        position: absolute; bottom: -120px;
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
        border: 1px solid rgba(255,255,255,0.25); border-radius: 50%;
        box-shadow: inset 0 0 24px rgba(255,255,255,0.12), 0 12px 40px rgba(0,0,0,0.35);
        animation: rise 18s infinite linear;
      }

      /* GLASS NAV DOCK */
      nav {
        position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
        display: flex; gap: 22px; padding: 14px 18px; border-radius: 50px;
        background: rgba(16, 16, 28, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        box-shadow: var(--shadow-soft), 0 0 26px rgba(106,17,203,0.28);
        z-index: 1000; transition: all .35s var(--trans-2);
      }
      nav:hover {
        transform: translateX(-50%) translateY(-6px);
        background: rgba(16, 16, 28, 0.82);
        box-shadow: var(--shadow-strong), 0 0 34px rgba(106,17,203,0.38);
      }
      nav a {
        width: 44px; height: 44px; border-radius: 14px;
        display: grid; place-items: center; font-size: 19px; color: #fff;
        background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: inset 0 0 16px rgba(255,255,255,0.08);
        transition: transform .25s var(--trans-2), box-shadow .25s var(--trans-2), background .25s var(--trans-2);
        position: relative;
      }
      nav a:hover {
        transform: translateY(-8px) scale(1.08);
        background: radial-gradient(60% 80% at 50% 30%, rgba(0, 198, 255, .28), rgba(255,255,255,0.06));
        box-shadow: 0 8px 18px rgba(0, 198, 255, 0.32), inset 0 0 22px rgba(255,255,255,0.18);
      }
      nav a::after {
        content: attr(data-tooltip); position: absolute; bottom: 54px; left: 50%; transform: translateX(-50%) scale(0.88);
        background: #11131e; color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; opacity: 0; pointer-events: none; white-space: nowrap;
        border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 8px 20px rgba(0,0,0,0.35);
        transition: opacity .25s var(--trans-2), transform .25s var(--trans-2);
      }
      nav a:hover::after { opacity: 1; transform: translateX(-50%) scale(1); }

      /* Theme switcher pill */
      .theme-btn {
        position: fixed; top: 28px; right: 28px;
        padding: 12px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2);
        background: var(--gradient-1); color: #fff; font-weight: 700; cursor: pointer; z-index: 1200;
        display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 0 26px rgba(255,0,122,0.45), 0 8px 18px rgba(0,0,0,0.35);
        transition: transform .25s var(--trans-2), box-shadow .25s var(--trans-2), filter .25s var(--trans-2);
        backdrop-filter: var(--blur-10);
      }
      .theme-btn:hover {
        transform: translateY(-3px) scale(1.06) rotate(1.5deg);
        box-shadow: 0 0 38px rgba(255,0,122,0.65), 0 10px 28px rgba(0,0,0,0.45);
        filter: saturate(1.1);
      }

      /* HERO */
      .hero { min-height: 100vh; display: grid; place-items: center; padding: 120px 20px; position: relative; perspective: 1600px; }
      .hero-3d-bg { position: absolute; inset: 0; z-index: 0; perspective: 2000px; overflow: hidden; }
      .hero-3d-layer {
        position: absolute; inset: 0;
        background:
          linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.55)),
          url('hero-bg.jpg.jpeg') center/cover no-repeat;
        transform: translateZ(-220px) scale(1.34);
        filter: blur(1.6px) brightness(1.08) contrast(1.1) saturate(1.25);
        transition: transform .18s ease-out;
        border-radius: 40px;
        box-shadow: inset 0 -120px 140px rgba(0,0,0,0.35);
      }

      .hero-content {
        max-width: 1380px;
        width: 100%;
        display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 68px;
        align-items: center; z-index: 2; transform-style: preserve-3d;
      }

      .hero-text { transform-style: preserve-3d; z-index: 3; }
      .hero-badge {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 10px 24px; border-radius: 999px;
        background: linear-gradient(90deg, #ff007a, #6a11cb);
        font-weight: 800; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
        margin-bottom: 22px; box-shadow: 0 0 26px rgba(255,0,122,0.38), inset 0 1px 0 rgba(255,255,255,0.2);
        transform: translateZ(34px);
        animation: badgeGlow 3s ease-in-out infinite;
      }
      .hero h1 {
        font-size: clamp(3rem, 6vw, 5.2rem); line-height: 1.08;
        background: linear-gradient(135deg, #fff 0%, #a5f3fc 52%, #6a11cb 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        margin-bottom: 22px; filter: drop-shadow(0 0 16px rgba(255,255,255,0.28));
        transform: translateZ(44px);
        text-wrap: balance;
      }
      .hero p {
        font-size: 1.18rem; line-height: 1.9; color: var(--text-muted);
        margin-bottom: 34px; border-left: 4px solid #2575fc; padding-left: 18px;
        transform: translateZ(24px);
      }
      .hero-buttons { margin-top: 34px; transform: translateZ(32px); display: flex; flex-wrap: wrap; gap: 14px; }

      .hero-btn {
        padding: 15px 30px; border-radius: 30px; font-weight: 800; position: relative; overflow: hidden;
        transition: transform .25s var(--trans-2), box-shadow .25s var(--trans-2), background .25s var(--trans-2);
        border: none; display: inline-flex; align-items: center; gap: 10px;
      }
      .hero-btn .btn-glow {
        position: absolute; inset: 0; background: var(--shimmer); transform: translateX(-100%); opacity: 0.35;
      }
      .hero-btn:hover .btn-glow { animation: shimmer 1s linear; }

      .btn-primary {
        background: #fff; color: #000;
        box-shadow: 0 0 26px rgba(255,255,255,0.36), 0 6px 16px rgba(0,0,0,0.22);
      }
      .btn-primary:hover {
        transform: translateY(-4px) scale(1.03);
        box-shadow: 0 0 36px rgba(255,255,255,0.6), 0 12px 28px rgba(0,0,0,0.35);
      }
      .btn-secondary {
        background: transparent; color: #fff; border: 2px solid #fff;
        box-shadow: 0 0 16px rgba(255,255,255,0.22), inset 0 0 15px rgba(255,255,255,0.1);
      }
      .btn-secondary:hover {
        background: rgba(255,255,255,0.1);
        transform: translateY(-4px) scale(1.03);
        box-shadow: 0 0 28px rgba(255,255,255,0.32), inset 0 0 22px rgba(255,255,255,0.16);
      }

      /* HERO portrait cluster: main + floating cubes + rings */
      .hero-img-container { position: relative; width: 100%; height: 640px; transform-style: preserve-3d; perspective: 1600px; }
      .hero-img-bg {
        position: absolute; inset: 0;
        background: url('hero-bg.jpg.jpeg') center/cover no-repeat; border-radius: 40px; opacity: 0.38;
        transform: translateZ(-90px) scale(0.96);
        filter: blur(12px) brightness(0.22) saturate(1.3);
      }

      .hero-img-main {
        position: absolute; width: 260px; height: 360px;
        top: 16%; right: 6%; left: auto;
        transform: translateZ(120px) rotateY(0deg) rotateX(0deg);
        background: url('portrait.jpg.jpeg') center/cover no-repeat;
        border-radius: 26px;
        border: 2px solid rgba(255,255,255,0.14);
        transition: transform .3s ease, box-shadow .3s ease, filter .3s ease;
        z-index: 50;
        animation: floatPortrait 8s ease-in-out infinite;
        overflow: visible;
        box-shadow: 0 18px 38px rgba(0, 0, 0, 0.45), 0 0 26px rgba(106, 17, 203, 0.36), 0 0 80px rgba(37, 117, 252, 0.18);
        isolation: isolate;
      }
      .hero-img-main:hover {
        transform: translateZ(140px) translateX(-4%) rotateY(2deg) rotateX(-1deg) scale(1.05);
        box-shadow: 0 28px 60px rgba(0,0,0,0.6), 0 0 46px rgba(106,17,203,0.42), 0 0 120px rgba(37,117,252,0.28);
        filter: saturate(1.06);
      }
      .hero-img-main::before {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(45deg, transparent 10%, rgba(255,255,255,0.055) 22%, transparent 80%);
        z-index: 1; animation: shine 3.2s ease-in-out infinite;
        mix-blend-mode: screen; pointer-events: none;
        border-radius: inherit;
      }
      .hero-img-main::after {
        content: ''; position: absolute; inset: -14px;
        border-radius: 32px;
        background:
          radial-gradient(120px 60px at 90% -20%, rgba(0, 198, 255, .35), transparent 60%),
          radial-gradient(140px 60px at 10% 120%, rgba(255, 0, 122, .35), transparent 60%);
        filter: blur(20px); opacity: 0.7; z-index: -1;
      }

      /* Floating micro cards around portrait */
      .float-card {
        position: absolute; display: inline-flex; align-items: center; gap: 10px; font-weight: 700;
        padding: 14px 22px; border-radius: 15px; z-index: 6;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.22);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        box-shadow: 0 16px 34px rgba(0,0,0,0.35), 0 0 22px rgba(106,17,203,0.22);
        transform: translateZ(90px);
        animation: floatCard 6.5s ease-in-out infinite;
      }
      .float-card i { font-size: 16px; color: #fff; text-shadow: 0 0 12px rgba(255,255,255,0.35); }
      .fc-1 { top: 10%; right: 9%; animation-delay: 0s; }
      .fc-2 { top: 33%; right: -1%; animation-delay: 2s; }
      .fc-3 { bottom: 10%; right: 12%; animation-delay: 1.2s; }

      /* Orbiting ring behind portrait */
      .ring {
        position: absolute; width: 440px; height: 440px; border-radius: 50%;
        right: -4%; top: 2%;
        background:
          conic-gradient(from 220deg, rgba(0, 198, 255, 0.55), rgba(255, 0, 122, 0.55), rgba(106, 17, 203, 0.55), rgba(0, 198, 255, 0.55));
        filter: blur(30px) saturate(1.15); opacity: 0.22;
        transform: translateZ(30px); z-index: 0;
        animation: ringPulse 8s ease-in-out infinite alternate;
      }

      /* Hero Socials grid */
      .hero-socials {
        display: grid; grid-template-columns: repeat(6, 1fr);
        gap: 20px; justify-items: center; align-items: center;
        margin: 40px auto 0; max-width: 560px; position: relative; z-index: 10; transform: translateZ(60px);
      }
      .hero-socials .hs {
        width: 60px; height: 60px; border-radius: 18px;
        display: grid; place-items: center; font-size: 24px; color: #fff;
        text-decoration: none;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 15px 30px rgba(0,0,0,0.42), inset 0 0 20px rgba(255,255,255,0.18), 0 0 20px currentColor;
        transform-style: preserve-3d;
        transition: all .32s var(--trans-1);
        position: relative; overflow: hidden;
      }
      .hero-socials .hs::before {
        content: ''; position: absolute; inset: 0; left: -100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
        transition: left .62s var(--trans-1);
      }
      .hero-socials .hs:hover::before { left: 100%; }
      .hero-socials .hs:hover {
        transform: translateY(-16px) rotateX(18deg) rotateY(-18deg) scale(1.18);
        box-shadow: 0 32px 58px rgba(0,0,0,0.6), 0 0 36px currentColor, inset 0 0 30px rgba(255,255,255,0.26);
      }

      .hs.mail { background: linear-gradient(135deg, #D44638, #B23121); box-shadow: 0 15px 30px rgba(212,70,56,0.3); }
      .hs.whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); box-shadow: 0 15px 30px rgba(37,211,102,0.3); }
      .hs.linkedin { background: linear-gradient(135deg, #0077B5, #004182); box-shadow: 0 15px 30px rgba(0,119,181,0.3); }
      .hs.instagram { background: linear-gradient(135deg, #833AB4, #FD1D1D, #F77737); box-shadow: 0 15px 30px rgba(131,58,180,0.3); }
      .hs.facebook { background: linear-gradient(135deg, #1877F2, #0F4AA1); box-shadow: 0 15px 30px rgba(24,119,242,0.3); }
      .hs.twitter { background: linear-gradient(135deg, #000000, #444444); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
      .hs.wef { background: linear-gradient(135deg, #00A3E0, #005F86); box-shadow: 0 15px 30px rgba(0,163,224,0.3); }
      .hs.linktree { background: linear-gradient(135deg, #43E660, #1FA337); box-shadow: 0 15px 30px rgba(67,230,96,0.3); }
      .hs.tiktok { background: linear-gradient(135deg, #010101, #FF0050, #00F2EA); box-shadow: 0 15px 30px rgba(255,0,80,0.3); }
      .hs.snapchat { background: linear-gradient(135deg, #FFFC00, #FFD000); color: #000; box-shadow: 0 15px 30px rgba(255,252,0,0.3); }
      .hs.threads { background: linear-gradient(135deg, #000000, #444444); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
      .hs.ok { background: linear-gradient(135deg, #F47300, #FF9E2C); box-shadow: 0 15px 30px rgba(244,115,0,0.3); }

      /* Sections & Cards */
      section { max-width: 1240px; margin: 0 auto; padding: 120px 20px; position: relative; transform-style: preserve-3d; }
      .section-title {
        font-size: clamp(2.2rem, 3.5vw, 3.5rem); text-align: center; margin-bottom: 72px;
        position: relative; z-index: 1; transform: translateZ(30px);
        background: linear-gradient(120deg, #fff 0%, #c2e9fb 60%, #a1c4fd 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      .section-title::after {
        content: ''; display: block; width: 120px; height: 4px; margin: 18px auto 0;
        background: var(--gradient-2); border-radius: 3px; animation: linePulse 3s ease-in-out infinite;
        box-shadow: 0 8px 22px rgba(37,117,252,0.45);
      }

      .glass-card {
        background: var(--glass-bg); border: 1px solid var(--glass-border);
        border-radius: var(--card-radius); padding: 48px; overflow: clip;
        box-shadow: var(--glass-shadow); position: relative; transform-style: preserve-3d; transform: translateZ(0);
        transition: transform .6s var(--trans-1), border-color .6s var(--trans-1), box-shadow .6s var(--trans-1), filter .6s var(--trans-1);
        isolation: isolate;
      }
      .glass-card::before {
        content: ''; position: absolute; inset: 0; left: -100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        transition: left .85s var(--trans-1); z-index: 1; pointer-events: none;
      }
      .glass-card:hover {
        transform: translateY(-14px) rotateX(2.4deg) rotateY(2.4deg) translateZ(24px);
        border-color: rgba(255,255,255,0.38);
        box-shadow: 0 40px 90px rgba(106,17,203,0.4), inset 0 0 30px rgba(255,255,255,0.14);
        filter: saturate(1.05);
      }
      .glass-card:hover::before { left: 100%; }

      /* Timeline */
      .timeline { position: relative; max-width: 860px; margin: 0 auto; transform-style: preserve-3d; }
      .timeline::before {
        content: ''; position: absolute; left: 50%; transform: translateX(-50%);
        width: 3px; height: 100%;
        background: linear-gradient(to bottom, transparent, #6a11cb, #2575fc, #ff007a, transparent);
        box-shadow: 0 0 30px rgba(106,17,203,0.5);
      }
      .timeline-item { margin-bottom: 60px; width: 100%; display: flex; justify-content: center; opacity: 0; transform: translateY(50px) rotateX(16deg); transition: all .8s ease-out; transform-style: preserve-3d; }
      .timeline-item.visible { opacity: 1; transform: translateY(0) rotateX(0); }
      .timeline-item:nth-child(odd) { justify-content: flex-start; }
      .timeline-item:nth-child(even) { justify-content: flex-end; }

      .timeline-content {
        width: 46%; background: rgba(255,255,255,0.07);
        backdrop-filter: blur(16px); padding: 26px 28px; border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.16); position: relative; transform-style: preserve-3d; transition: all .38s ease;
      }
      .timeline-content:hover { transform: translateZ(22px); border-color: rgba(0,198,255,0.4); box-shadow: 0 22px 44px rgba(0,198,255,0.22); }
      .timeline-content h4 { color: #9ddcff; margin-bottom: 12px; font-size: 1.15rem; letter-spacing: .4px; }
      .timeline-content p { color: rgba(255,255,255,0.88); line-height: 1.7; }

      .timeline-dot {
        position: absolute; width: 24px; height: 24px; background: #fff; border-radius: 50%; left: 50%; top: 28px; transform: translateX(-50%) translateZ(10px);
        box-shadow: 0 0 26px #00c6ff, 0 0 18px #00c6ff, inset 0 0 10px rgba(255,255,255,0.55);
        z-index: 5; animation: pulse 2.2s ease-in-out infinite;
      }

      /* Grid layouts */
      .grid-3 {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 38px; transform-style: preserve-3d;
      }

      /* Gallery */
      .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 26px; transform-style: preserve-3d; }
      .gallery-item {
        height: 320px; border-radius: 20px; overflow: clip; position: relative; cursor: pointer;
        box-shadow: 0 16px 36px rgba(0,0,0,0.55), inset 0 0 22px rgba(255,255,255,0.06);
        transition: transform .6s var(--trans-1), box-shadow .6s var(--trans-1), filter .6s var(--trans-1);
        transform-style: preserve-3d; transform: rotateX(5deg) rotateY(5deg);
        border: 1px solid rgba(255,255,255,0.1);
        background: radial-gradient(140% 80% at 50% 10%, rgba(255,255,255,0.06), transparent 50%);
      }
      .gallery-item:nth-child(even) { transform: rotateX(-5deg) rotateY(-5deg); }
      .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease, filter .6s ease; filter: saturate(0.98) contrast(1.02); }
      .gallery-item:hover {
        transform: scale(1.085) rotateX(0) rotateY(0) translateZ(52px);
        box-shadow: 0 32px 64px rgba(0,198,255,0.38), 0 0 42px rgba(106,17,203,0.45);
        z-index: 10; filter: saturate(1.08);
      }
      .gallery-item:hover img { transform: scale(1.16); }
      .gallery-overlay {
        position: absolute; inset-block-end: 0; left: 0; width: 100%;
        background: linear-gradient(transparent, rgba(0,0,0,0.85));
        padding: 24px; opacity: 0; transform: translateY(22px); transition: opacity .4s ease, transform .4s ease;
      }
      .gallery-item:hover .gallery-overlay { opacity: 1; transform: translateY(0); }

      /* Thematic tags */
      .thematic-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin-top: 26px; }
      .theme-tag {
        padding: 12px 22px; background: rgba(255,255,255,0.08); border-radius: 999px; border: 2px solid transparent; font-weight: 700;
        transition: transform .25s var(--trans-2), box-shadow .25s var(--trans-2), border-color .25s var(--trans-2);
        position: relative; overflow: hidden;
      }
      .theme-tag::before { content: ''; position: absolute; inset: 0; left: -100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent); transition: left .55s ease; }
      .theme-tag:hover::before { left: 100%; }
      .theme-tag:hover { transform: translateY(-6px) scale(1.06); box-shadow: 0 12px 26px rgba(0,0,0,0.35); }

      /* Connect section */
      .connect-box { text-align: center; transform-style: preserve-3d; }
      .social-3d-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 34px; margin-top: 42px; perspective: 900px; transform-style: preserve-3d; }
      .social-btn {
        width: 82px; height: 82px; border-radius: 22px; display: grid; place-items: center; font-size: 32px; color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.08);
        transition: transform .5s var(--trans-1), box-shadow .5s var(--trans-1), border-color .5s var(--trans-1);
        box-shadow: 0 16px 36px rgba(0,0,0,0.45), inset 0 0 22px rgba(255,255,255,0.12);
        position: relative; overflow: hidden; transform-style: preserve-3d;
      }
      .social-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--c1), var(--c2)); opacity: 0; transition: opacity .5s ease; z-index: 1; }
      .social-btn:hover {
        transform: rotateX(20deg) rotateY(20deg) translateY(-14px) scale(1.15);
        box-shadow: 0 28px 56px rgba(0,0,0,0.6), 0 0 30px var(--c1), inset 0 0 30px rgba(255,255,255,0.22);
        border-color: transparent;
      }
      .social-btn:hover::before { opacity: 1; }
      .social-btn i { transition: transform .5s ease; z-index: 2; position: relative; }
      .social-btn:hover i { transform: scale(1.28) translateZ(28px); }

      /* Mission */
      .mission-card {
        background: linear-gradient(135deg, rgba(106, 17, 203, 0.4), rgba(37, 117, 252, 0.4), rgba(255, 0, 122, 0.4));
        backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.22);
        border-radius: var(--radius-lg); padding: 58px; text-align: center; position: relative; overflow: hidden;
        transform-style: preserve-3d; animation: missionGlow 3.8s ease-in-out infinite;
        box-shadow: 0 24px 64px rgba(0,0,0,0.45);
      }
      .mission-card i { font-size: 64px; color: #fff; margin-bottom: 28px; text-shadow: 0 0 24px rgba(255,255,255,0.45); }
      .mission-card h2 {
        font-size: clamp(1.6rem, 2.2vw, 2.4rem); margin-bottom: 18px;
        background: linear-gradient(45deg, #fff, #a5f3fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      .mission-card p { font-size: clamp(1.12rem, 1.4vw, 1.4rem); font-family: 'Playfair Display', serif; line-height: 1.9; max-width: 860px; margin: 0 auto; }

      /* Extra: Stats / Counters */
      .stats {
        display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); gap: 18px; margin-top: 26px;
      }
      .stat {
        padding: 22px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.14);
        background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.04));
        text-align: center;
        box-shadow: 0 16px 38px rgba(0,0,0,0.38);
      }
      .stat .num {
        font-size: clamp(1.8rem, 2.6vw, 2.6rem); font-weight: 900; letter-spacing: .6px;
        background: linear-gradient(90deg, #a5f3fc 0%, #6a11cb 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        text-shadow: 0 0 20px rgba(37,117,252,0.25);
      }
      .stat .label { margin-top: 6px; color: rgba(255,255,255,0.82); font-weight: 600; font-size: .98rem; }

      /* Footer */
      footer {
        text-align: center; padding: 32px 18px; color: #9aa1ad; font-size: 14px; background: rgba(0,0,0,0.32);
        border-top: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(10px);
        position: relative; z-index: 2;
      }
      footer::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, #6a11cb, #2575fc, #ff007a, transparent);
      }

      /* Utilities & badges */
      .animate-on-scroll { opacity: 0; transform: translateY(50px) rotateX(10deg); transition: all .85s var(--trans-1); }
      .animate-on-scroll.visible { opacity: 1; transform: translateY(0) rotateX(0); }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.28); }
      ::-webkit-scrollbar-thumb { background: linear-gradient(45deg, #6a11cb, #2575fc); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: linear-gradient(45deg, #2575fc, #6a11cb); }
    }
